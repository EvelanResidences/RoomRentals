<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tenant Area | EVELAN Residences</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2a2e;--mu:#6b7780;--ac:#1f6f6b;--bd:#e2e0d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191b;--card:#1e2427;--tx:#e8ecee;--mu:#98a4ab;--ac:#4fb3ad;--bd:#2f393d;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.top nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.top a{color:var(--tx);text-decoration:none}
.btn{display:inline-block;background:var(--ac);color:#fff!important;padding:9px 18px;border-radius:99px;text-decoration:none}
.hero{padding:88px 20px;background:linear-gradient(135deg,#1f6f6b,#16403f);color:#fff}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px}.hero p{max-width:600px;font-size:1.1rem;opacity:.92}
.hero .btn{background:#fff;color:#16403f!important;margin:8px 8px 0 0}.hero .btn.ghost{background:transparent;color:#fff!important;border:1px solid #fff}
.wrap{max-width:960px;margin:0 auto}.sec{padding:36px 20px}.sec>h2{font-size:1.5rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:1.05rem}.card p{margin:0 0 10px}.card ul,.card ol,.sec ul{margin:6px 0;padding-left:22px}
.pre{white-space:pre-wrap}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .card{margin:0}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.chk{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.chk li{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.am{font-size:1.5rem;display:block}
footer{text-align:center;padding:24px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.lf{display:flex;gap:8px;flex-wrap:wrap}.lf input{flex:1;min-width:200px;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}.lf button{border:0;font:inherit;cursor:pointer}
.tw{overflow-x:auto;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-weight:600}
.s-paid{color:#1d7a46}.s-due{color:#b25e00}.s-overdue{color:#b3261e}@media (prefers-color-scheme:dark){.s-paid{color:#5bc48a}.s-due{color:#e0a24d}.s-overdue{color:#f08a82}}

.f{display:grid;gap:10px;max-width:560px}.f select,.f textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}.f textarea{min-height:110px}.f button{border:0;font:inherit;cursor:pointer;justify-self:start}
td.d{white-space:normal;min-width:180px}
.qr{max-width:240px;width:100%;border-radius:12px;background:#fff;display:block;margin:10px 0}
</style></head><body>
<header class="top"><b>EVELAN Residences</b><nav><a href="index.html">Home</a><a class="btn" href="#" id="out">Sign out</a></nav></header>
<main class="wrap sec"><h2 id="hi">Loading\u2026</h2><div id="app"></div></main>
<script>
const DUES_URL="https://script.google.com/macros/s/AKfycbyWaSoOHqrt-F3CCuXFeT8Oqram2fkphuIKYdnFb6w-KsJSnscqRWqT7qEAM2TkgDg/exec";
/* ===== EDIT: payment QR. Upload your QR images to the same GitHub folder with these file names ===== */
const PAY={methods:[{name:"Maya",qr:"qr-maya.jpeg"},{name:"BPI",qr:"qr-bpi.jpg"}],text:"Prefer to pay online? Choose Maya or BPI and scan its QR code below with your e-wallet or banking app, enter the amount due, and send your proof of payment (screenshot or reference number) to Manilyn http://m.me/manilynabellar or saved it and let Nanay Eve know you already paid online to Manilyn. Your status is updated once payment is confirmed."};
/* ================================================================================================ */
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
const email=sessionStorage.getItem('evl');
const leave=()=>{sessionStorage.removeItem('evl');location.href='index.html#login'};
$('#out').addEventListener('click',e=>{e.preventDefault();leave()});
if(!email)leave();
const table=(heads,rows)=>{const tb=el('table'),hr=el('tr');heads.forEach(x=>hr.append(el('th','',x)));tb.append(hr);rows.forEach(r=>tb.append(r));const w=el('div','tw');w.append(tb);return w};
const cell=(v,c)=>el('td',c||'',v);
function dues(list){const c=el('div','card');c.append(el('h3','','Your dues'));
 if(!list.length){c.append(el('p','mu','No dues recorded yet.'));return c}
 c.append(table(['Month','Item','Amount','Status','Date paid'],list.map(x=>{const tr=el('tr');const amt=/^[\d.,]+$/.test(x.amount)?'\u20b1'+x.amount:x.amount;
  const st=['paid','due','overdue'].includes(x.status)?x.status:'';
  tr.append(cell(x.month),cell(x.item),cell(amt),cell(x.status,'s-'+st),cell(x.paid||'\u2014'));return tr})));return c}
function reqList(list){const c=$('#rl');c.replaceChildren();
 if(!list.length){c.append(el('p','mu','No requests yet.'));return}
 c.append(table(['Date','Type','Details','Status'],list.map(x=>{const tr=el('tr');const done=x.status.toLowerCase()==='done';
  tr.append(cell(x.date),cell(x.type),cell(x.details,'d'),cell(x.status,done?'s-paid':'s-due'));return tr})))}
function pay(){const c=el('div','card');c.append(el('h3','','Pay online'),el('p','mu',PAY.text));
 const g=el('div','grid');
 PAY.methods.forEach(m=>{const b=el('div');b.append(el('b','',m.name));const i=el('img','qr');i.src=m.qr;i.alt=m.name+' payment QR code';i.onerror=()=>b.remove();b.append(i);g.append(b)});
 c.append(g);return c}
function form(){const c=el('div','card');c.append(el('h3','','Send a request'));
 c.append(el('p','mu','Internet installation: request installation assistance or approval; the landlord or landlady reviews requests within 1\u20132 business days. Maintenance: report plumbing, electrical, furniture, internet, or facility concerns; urgent issues are prioritized.'));
 const f=el('form','f'),ty=el('select'),tx=el('textarea'),b=el('button','btn','Submit request'),msg=el('div','mu');
 ['Internet Installation','Maintenance'].forEach(v=>{const o=el('option','',v);o.value=v;ty.append(o)});
 tx.placeholder='Describe your request (room/unit, what\u2019s wrong or what you need)';tx.maxLength=1000;tx.required=true;
 f.append(ty,tx,b,msg);
 f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;msg.textContent='Sending\u2026';
  try{const r=await fetch(DUES_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({email,type:ty.value,details:tx.value})});const d=await r.json();
   if(d.ok){msg.textContent='Request sent. The manager will update its status below.';tx.value='';reqList(d.requests)}
   else msg.textContent=d.error==='limit'?'You have too many open requests. Please wait for some to be completed.':'We couldn\u2019t send your request. Please try again or contact the manager.'
  }catch(err){msg.textContent='Something went wrong. Please try again later.'}
  b.disabled=false});
 c.append(f);return c}
(async()=>{
 if(!email)return;
 try{const r=await fetch(DUES_URL+'?email='+encodeURIComponent(email));const d=await r.json();
  if(!d.ok){leave();return}
  $('#hi').textContent='Hello, '+d.name;
  const a=$('#app'),rc=el('div','card');rc.append(el('h3','','Your requests'),el('div','','' ));rc.lastChild.id='rl';
  a.append(dues(d.dues),pay(),form(),rc);reqList(d.requests);
 }catch(err){$('#hi').textContent='Something went wrong. Please refresh the page.'}
})();
</script></body></html>
