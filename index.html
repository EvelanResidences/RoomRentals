<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVELAN Residences</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2a2e;--mu:#6b7780;--ac:#1f6f6b;--bd:#e2e0d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191b;--card:#1e2427;--tx:#e8ecee;--mu:#98a4ab;--ac:#4fb3ad;--bd:#2f393d;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.top nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.top a{color:var(--tx);text-decoration:none}
.btn{display:inline-block;background:var(--ac);color:#fff!important;padding:9px 18px;border-radius:99px;text-decoration:none}
.hero{padding:88px 20px;background:linear-gradient(135deg,#1f6f6b,#16403f);color:#fff}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px}.hero p{max-width:600px;font-size:1.1rem;opacity:.92}
.hero .btn{background:#fff;color:#16403f!important;margin:8px 8px 0 0}.hero .btn.ghost{background:transparent;color:#fff!important;border:1px solid #fff}
.wrap{max-width:960px;margin:0 auto}.sec{padding:36px 20px}.sec>h2{font-size:1.5rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:1.05rem}.card p{margin:0 0 10px}.card ul,.card ol,.sec ul{margin:6px 0;padding-left:22px}
.pre{white-space:pre-wrap}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .card{margin:0}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:12px}
.chk{list-style:none;padding:0!important;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.chk li{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.am{font-size:1.5rem;display:block}
footer{text-align:center;padding:24px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
</style></head><body>
<header class="top"><b id="sn"></b><nav><a href="#about">About</a><a href="#why">Why us</a><a href="#news">Announcements</a><a href="#rules">House rules</a><a href="#requests">Requests</a><a class="btn" href="#contact">Contact</a></nav></header>
<section class="hero"><div class="wrap"><h1 id="hn"></h1><p id="tg"></p><a class="btn" href="#contact">Inquire about a room</a><a class="btn ghost" href="#requests">Tenant requests</a></div></section>
<section id="about" class="wrap sec"><h2>About Us</h2><p id="ab"></p><div class="grid"><div class="card"><h3>Features</h3><ul id="ft1"></ul></div><div class="card"><h3>Perfect For</h3><ul id="pf"></ul></div></div><div class="grid" id="ph" style="margin-top:12px"></div></section>
<section id="why" class="wrap sec"><h2>Why Choose EVELAN Residences?</h2><ul class="chk" id="wy"></ul><h2 style="margin-top:28px">Amenities</h2><div class="grid" id="am"></div></section>
<section id="news" class="wrap sec"><h2>Announcements</h2><p id="ni"></p><ul id="nt"></ul><div id="nw"></div></section>
<section id="rules" class="wrap sec"><h2>House Rules</h2><div class="card"><ol id="ru"></ol></div></section>
<section id="requests" class="wrap sec"><h2>Tenant Requests</h2><div class="grid" id="fm"></div></section>
<section id="contact" class="wrap sec"><h2>Contact &amp; Inquiries</h2><div class="card"><p id="cq"></p><div class="pre" id="ct"></div></div></section>
<footer id="fo"></footer>
<script>
/* ===== EDIT THIS BLOCK ONLY ===== */
const SITE={
 name:"EVELAN Residences",
 tagline:"Affordable and comfortable room rentals in a safe, quiet, and convenient location. With high-speed fiber internet ready and a welcoming community ideal for students, professionals, and long-term tenants.",
 about:"Evelan Residences offers affordable room rentals designed for comfort and convenience. Conveniently located near schools, offices, public transportation, supermarkets, and other essential establishments, our residence provides a safe, secure, and well-maintained environment for responsible tenants.",
 features:["High-speed fiber internet ready","Each unit includes a private bedroom, kitchen, bathroom, and cozy living area","24/7 CCTV monitoring at the entrance area"],
 perfectFor:["Working professionals","Remote workers","Students and reviewees","Long-term renters seeking a quiet environment"],
 why:["Fast and reliable internet","Safe and secure environment","Convenient location","Affordable monthly rates","Responsive management","Clean and well-maintained facilities","Friendly and welcoming community"],
 amenities:[["📶","Fiber Internet (Optional)"],["⚡","Sub-metered Electricity"],["🔒","CCTV Security (Entrance Gate)"],["🏍️","Motorcycle Parking (First Come, First Served)"]],
 announcementIntro:"Stay updated with important residence notices, including:",
 announcementTopics:["Scheduled maintenance activities","Internet service interruptions","Water or power service advisories","Holiday office schedules","General reminders for tenants"],
 notices:[] /* add specific notices, e.g. {title:"Water interruption",text:"Dec 3, 9 AM to 12 NN"} */,
 rules:["Quiet hours are observed from 9:00 PM to 6:00 AM.","Keep corridors and common areas clean at all times.","Dispose of waste in designated trash bins.","Report maintenance concerns through the request form or directly to the landlord/landlady.","Respect fellow tenants and avoid disruptive behavior.","Secure personal belongings and lock your room when leaving."],
 forms:[
  {label:"Internet Installation Request",text:"Request internet installation assistance or approval. The landlord or landlady will review requests within 1\u20132 business days.",url:""},
  {label:"Maintenance Request",text:"Report plumbing, electrical, furniture, internet, or facility-related concerns. Urgent issues will be prioritized and addressed as soon as possible.",url:""}
 ],
 contactIntro:"Have questions or would like to schedule a viewing?",
 contact:"Phone: 0976 223 0105\nOffice Hours: Monday to Sunday, 6:00 AM \u2013 8:00 PM\nAddress: Hillside, Talamban, Cebu City",
 photos:[] /* e.g. ["photos/room1.jpg","photos/front.jpg"] */
};
/* ================================= */
const $=s=>document.querySelector(s);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
const t=(s,v)=>{$(s).textContent=v};
const list=(s,arr)=>arr.forEach(x=>$(s).append(el('li','',x)));
document.title=SITE.name;t('#sn',SITE.name);t('#hn',SITE.name);t('#tg',SITE.tagline);t('#ab',SITE.about);
t('#ni',SITE.announcementIntro);t('#cq',SITE.contactIntro);t('#ct',SITE.contact);t('#fo','\u00a9 '+new Date().getFullYear()+' '+SITE.name);
list('#ft1',SITE.features);list('#pf',SITE.perfectFor);list('#nt',SITE.announcementTopics);list('#ru',SITE.rules);
SITE.why.forEach(x=>$('#wy').append(el('li','','\u2705 '+x)));
SITE.amenities.forEach(a=>{const c=el('div','card');c.append(el('span','am',a[0]),el('div','',a[1]));$('#am').append(c)});
SITE.notices.forEach(a=>{const c=el('div','card');c.append(el('h3','',a.title),el('div','pre',a.text));$('#nw').append(c)});
SITE.forms.forEach(f=>{const c=el('div','card');c.append(el('h3','',f.label),el('p','mu',f.text));
 if(/^https:\/\//.test(f.url)){const a=el('a','btn','Open form');a.href=f.url;a.target='_blank';a.rel='noopener';c.append(a)}else c.append(el('span','mu','Form link coming soon.'));
 $('#fm').append(c)});
SITE.photos.forEach(p=>{if(/^[\w\-\/.]+\.(jpe?g|png|webp|gif)$/i.test(p)){const i=el('img');i.src=p;i.alt='';i.loading='lazy';$('#ph').append(i)}});
</script></body></html>
