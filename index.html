<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Residence</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1f2a2e;--mu:#6b7780;--ac:#1f6f6b;--bd:#e2e0d8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15191b;--card:#1e2427;--tx:#e8ecee;--mu:#98a4ab;--ac:#4fb3ad;--bd:#2f393d;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
.top nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.top a{color:var(--tx);text-decoration:none}
.btn{display:inline-block;background:var(--ac);color:#fff!important;padding:9px 18px;border-radius:99px;text-decoration:none}
.hero{padding:88px 20px;background:linear-gradient(135deg,#1f6f6b,#16403f);color:#fff}
.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px}.hero p{max-width:560px;font-size:1.1rem;opacity:.92}
.hero .btn{background:#fff;color:#16403f!important;margin:8px 8px 0 0}.hero .btn.ghost{background:transparent;color:#fff!important;border:1px solid #fff}
.wrap{max-width:960px;margin:0 auto}.sec{padding:36px 20px}.sec>h2{font-size:1.5rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card h3{margin:0 0 6px;font-size:1.05rem}.pre{white-space:pre-wrap}.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid img{width:100%;height:180px;object-fit:cover;border-radius:12px}
footer{text-align:center;padding:24px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd);padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
</style></head><body>
<header class="top"><b id="sn"></b><nav><a href="#about">About</a><a href="#news">Announcements</a><a href="#rules">House rules</a><a href="#requests">Tenant requests</a><a class="btn" href="#contact">Contact</a></nav></header>
<section class="hero"><div class="wrap"><h1 id="hn"></h1><p id="tg"></p><a class="btn" href="#contact">Inquire about a room</a><a class="btn ghost" href="#requests">Tenant requests</a></div></section>
<section id="about" class="wrap sec"><h2>About us</h2><div class="pre" id="ab"></div><div class="grid" id="ph"></div></section>
<section id="news" class="wrap sec"><h2>Announcements</h2><div id="nw"></div></section>
<section id="rules" class="wrap sec"><h2>House rules</h2><div class="card pre" id="ru"></div></section>
<section id="requests" class="wrap sec"><h2>Tenant requests</h2><p class="mu">Current tenants: use these forms for your requests. For dues and payment details, please message the manager directly.</p><div class="grid" id="fm"></div></section>
<section id="contact" class="wrap sec"><h2>Contact &amp; inquiries</h2><div class="card pre" id="ct"></div></section>
<footer id="ft"></footer>
<script>
/* ===== EDIT THIS BLOCK ONLY ===== */
const SITE={
 name:"Evelan Residences",
 tagline:"Affordable and comfortable room rentals in a safe, quiet, and convenient location. Enjoy high-speed internet, clean common areas, and a welcoming community ideal for students, professionals, and long-term tenants.",
 about:"Conveniently located near schools, offices, public transportation, supermarkets, and other essential establishments, our residence offers a safe, secure, and well-maintained environment for students, professionals, and long-term tenants.

Features:
1 bedroom
Own small living space
Own kitchen and bathroom
CCTV in the entrance area

Perfect for:
Working professionals
Remote workers
Reviewees and students
Long-term renters seeking a quiet environment
  
  ",
 announcements:[
  {title:"Welcome!",text:"Post notices here, such as scheduled maintenance, internet downtime, or payment reminders (no names or amounts)."}
 ],
 rules:"1. Quiet hours after 10 PM.\n2. Keep common areas clean.\n3. Report damages and problems through the maintenance form.",
 forms:[
  {label:"Internet installation request",url:""},
  {label:"Maintenance request",url:""}
 ],
 contact:"Phone / Viber: 09xx xxx xxxx\nEmail: you@example.com\nAddress: Street, City",
 photos:[] /* e.g. ["photos/room1.jpg","photos/front.jpg"] */
};
/* ================================= */
const $=s=>document.querySelector(s);
const t=(s,v)=>{$(s).textContent=v};
document.title=SITE.name;t('#sn',SITE.name);t('#hn',SITE.name);t('#tg',SITE.tagline);
t('#ab',SITE.about);t('#ru',SITE.rules);t('#ct',SITE.contact);t('#ft','\u00a9 '+new Date().getFullYear()+' '+SITE.name);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
SITE.announcements.forEach(a=>{const c=el('div','card');c.append(el('h3','',a.title),el('div','pre',a.text));$('#nw').append(c)});
if(!SITE.announcements.length)$('#nw').append(el('p','mu','No announcements right now.'));
SITE.forms.forEach(f=>{const c=el('div','card');c.append(el('h3','',f.label));
 if(/^https:\/\//.test(f.url)){const a=el('a','btn','Open form');a.href=f.url;a.target='_blank';a.rel='noopener';c.append(a)}else c.append(el('span','mu','Link coming soon.'));
 $('#fm').append(c)});
SITE.photos.forEach(p=>{if(/^[\w\-\/.]+\.(jpe?g|png|webp|gif)$/i.test(p)){const i=el('img');i.src=p;i.alt='';i.loading='lazy';$('#ph').append(i)}});
</script></body></html>
